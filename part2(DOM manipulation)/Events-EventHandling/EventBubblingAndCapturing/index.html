<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            width: 100%;
            height: 100%;
            background-color: #222;
        }
        #nav{
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            height: 100px;
            background-color: #444;
        }
        a{
            color: white;
        }
        button{
            padding: 12px 22px;
            color: white;
            background-color: red;
            border: none;
            font-weight: 600px;
            font-size: 20px;
        }
        .lt{
            text-decoration: line-through;
        }
        .a{
            width: 200px;
            height: 200px;
            background-color: pink;
        }
        .b{
            width: 80%;
            height: 80%;
            background-color: green;
        }
        .c{
            width: 80%;
            height: 80%;
            background-color: red;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="nav">
            <a href="">home</a> <a href="">about</a>
            <button>click and follow</button>
        </div>
    </div>
    <ul>
        <li>apple</li>
        <li>guava</li>
        <li>grapes</li>
        <li>banana</li>
        <li>mango</li>
    </ul>
    <div class="a">
        <div class="b">
            <div class="c">
                <button>click me</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

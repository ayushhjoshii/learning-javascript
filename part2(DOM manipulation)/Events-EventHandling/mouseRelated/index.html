<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        html, body{
            width: 100%;
            height: 100%;
        }

        /* Never apply this to the body, and always do this with the main div.
            this here we are doing to avoid getting the side scroll bar as soon
            as we reach the boundary of the page. */
        body{
            position: relative;
            overflow: hidden;
        }
        #abcd{
            position: absolute;
            /* transition: all cubic-bezier(0.19, 1, 0.22, 1) 1s; */
            width: 400px;
            height: 400px;
            background-color: red;
        }
    </style>
</head>
<body>
    <div id="abcd"></div>
    <script src="script.js"></script>
</body>
</html>
